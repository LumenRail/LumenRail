apiVersion: v1
kind: Namespace
metadata:
  name: lumenrail
  labels:
    app.kubernetes.io/name: lumenrail
    app.kubernetes.io/part-of: lumenrail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lumenrail-config
  namespace: lumenrail
data:
  NEXT_PUBLIC_STELLAR_NETWORK: "TESTNET"
  NEXT_PUBLIC_HORIZON_URL: "https://horizon-testnet.stellar.org"
  NEXT_PUBLIC_SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
  DATABASE_PROVIDER: "postgresql"
  NODE_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: lumenrail-secrets
  namespace: lumenrail
type: Opaque
stringData:
  DATABASE_URL: "postgresql://lumenrail:CHANGE_ME@postgres:5432/lumenrail"
  REDIS_URL: "redis://lumenrail:CHANGE_ME@redis:6379"
  NEXT_PUBLIC_CONTRACT_ID: "CHANGE_ME"
  NEXT_PUBLIC_EMITTER_CONTRACT_ID: "CHANGE_ME"
